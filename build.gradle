plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'dev.kikugie.stonecutter'
}


version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // isXander's maven — Controlify + its libraries
    maven { url = "https://maven.isxander.dev/releases/" }
    maven { url = "https://maven.isxander.dev/snapshots/" }
    // Quilt maven — quilt parsers (Controlify transitive)
    maven { url = "https://maven.quiltmc.org/repository/release/" }
    // ModMenu maven
    maven { url = "https://maven.terraformersmc.com/" }
    // Modrinth maven — ImmediatelyFast, Simple Voice Chat (Controlify compat)
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // PocketCanvasCore dependency (local composite build)
    implementation "com.pocketcanvascore:pocketcanvascore:1.0.0"

    // Controlify — optional controller integration (compile-only, not bundled)
    if (project.hasProperty('controlify_version') && project.controlify_version?.toString()?.trim()) {
        compileOnly "dev.isxander:controlify:${project.controlify_version}"
    } else {
        sourceSets.main.java.exclude(
                "com/pocketuicore/controller/PocketControlifyCompat.java",
                "com/pocketuicore/controller/PocketMenuScreenProcessor.java"
        )
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("processResources").configure {
    dependsOn tasks.named("stonecutterMerge")
}

def stonecutterMergeTask = tasks.named("stonecutterMerge")
["compileJava", "sourcesJar", "javadoc"].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn stonecutterMergeTask
    }
}

def stonecutterMergeTestTask = tasks.findByName("stonecutterMergeTest")
if (stonecutterMergeTestTask != null) {
    ["compileTestJava", "processTestResources", "testClasses"].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach {
            dependsOn stonecutterMergeTestTask
        }
    }
}

def javaVersion = 25

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.named("sourcesJar", Jar).configure {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Publish to local maven for dependent mods
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
